name: App bug
description: Report a problem with a PuckPulseTV app
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows installer
        - Windows portable
        - Android phone/tablet
        - Android TV
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Find this under Settings → About.
      placeholder: v1.0-WIN
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. See…"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Drag screenshots here or paste the exact error text.
